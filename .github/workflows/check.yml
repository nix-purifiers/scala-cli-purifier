# SPDX-License-Identifier: MIT
#
# Runs the test suite on x86_64-linux and aarch64-linux: `nix flake check`,
# which runs the unit tests of the scala-cli-purifier command, builds every
# fixture and the real-world projects in the Nix sandbox from their
# lockfiles, and runs the negative tests; then relocks the fixtures and
# requires the lockfiles to come out byte for byte the same.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check the flake
        run: nix flake check --print-build-logs --keep-going
      - name: Relock the fixtures and compare
        run: bash tests/relock-reproduces.sh

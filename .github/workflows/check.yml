# SPDX-License-Identifier: MIT
#
# Runs the test suite on Linux and Apple Silicon Darwin. The job `check`
# runs `nix flake check`: the unit tests of the scala-cli-purifier command,
# the builds of every fixture in the Nix sandbox from their lockfiles, and
# the conformance checks of the purifier contract that run in the sandbox.
# The jobs `conformance-relock` and `conformance-update` are the
# conformance checks that need the network.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check the flake
        id: flake
        run: |
          scala_sandbox=$(nix config show sandbox --option sandbox true)
          echo "Nix sandbox=$scala_sandbox"
          test "$scala_sandbox" = true
          nix flake check --print-build-logs --keep-going --option sandbox true
      - name: Diagnose the Darwin URL connection after a failing full check
        if: failure() && runner.os == 'macOS' && steps.flake.outcome == 'failure'
        run: |
          git rev-parse HEAD
          nix build '.#checks.aarch64-darwin.url-ipv4-diagnostic' \
            '.#checks.aarch64-darwin.url-jvm-diagnostic' \
            '.#checks.aarch64-darwin.url-jvm-transport-diagnostic' \
            '.#checks.aarch64-darwin.jvm-sdk-transport' \
            --keep-going --no-link --print-build-logs --option sandbox true \
            --option max-jobs 2 --option cores 2 --option eval-cache false

  # Relocking every fixture reproduces its lockfile byte for byte.
  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock the fixtures and compare
        run: bash tests/relock-reproduces.sh

  # `lock` keeps the resolution of a lockfile, and `update` moves it to
  # what is published now; each leaves a lockfile that passes the stale
  # check.
  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Lock and update a fixture with an old version
        run: bash tests/conformance-update.sh

  composition-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Native Nix project inputs
        run: python3 tests/composition-native.py

  tier2-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
        scala: ['3.9.0']
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Assert native execution system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = '${{ matrix.system }}'
      - name: Fresh capture, prefetch, ordinary offline, pure build and upstream sample
        env:
          SCALA_CLI_TIER2_SCALA_VERSION: ${{ matrix.scala }}
        run: python3 tests/tier2-runtime.py "$RUNNER_TEMP/scala-cli-runtime"
      - name: Retain execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scala-cli-runtime-${{ matrix.system }}-${{ matrix.scala }}
          path: |
            ${{ runner.temp }}/scala-cli-runtime/report.json
            ${{ runner.temp }}/scala-cli-runtime/*.log
            ${{ runner.temp }}/scala-cli-runtime/*.nix
            ${{ runner.temp }}/scala-cli-runtime/project/scala-cli-purifier.lock.json
          if-no-files-found: error
          retention-days: 30

  jvm-profile-runtime:
    name: JVM profile runtime (Scala 3.9.0, ${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SCALA_CLI_TIER2_PROFILE: jvm
      SCALA_CLI_TIER2_SCALA_VERSION: '3.9.0'
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 2
        eval-cache = false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Assert native execution system and sandbox
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = '${{ matrix.system }}'
          test "$(nix config show sandbox --option sandbox true)" = true
      - name: Fresh JVM capture, offline execution, pure build and upstream sample
        timeout-minutes: 100
        run: |
          mkdir -p "$RUNNER_TEMP/scala-cli-jvm-runtime-logs"
          set -o pipefail
          python3 tests/tier2-runtime.py "$RUNNER_TEMP/scala-cli-jvm-runtime" 2>&1 | tee "$RUNNER_TEMP/scala-cli-jvm-runtime-logs/driver.log"
      - name: Retain JVM runtime receipts, logs, expressions and fresh lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scala-cli-jvm-runtime-${{ matrix.system }}-3.9.0
          path: |
            ${{ runner.temp }}/scala-cli-jvm-runtime/report.json
            ${{ runner.temp }}/scala-cli-jvm-runtime/*.log
            ${{ runner.temp }}/scala-cli-jvm-runtime/*.nix
            ${{ runner.temp }}/scala-cli-jvm-runtime/project/scala-cli-purifier.lock.json
            ${{ runner.temp }}/scala-cli-jvm-runtime-logs/driver.log
          if-no-files-found: error
          retention-days: 30

  jvm-profile-composition:
    name: JVM profile composition (Scala 3.3.4 fixture, ${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      SCALA_CLI_TIER2_PROFILE: jvm
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 2
        eval-cache = false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Assert native execution system and sandbox
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = '${{ matrix.system }}'
          test "$(nix config show sandbox --option sandbox true)" = true
      - name: Direct and transitive JVM capture, run, publication and Maven consumer
        timeout-minutes: 60
        env:
          SCALA_CLI_COMPOSITION_RESULTS: ${{ runner.temp }}/scala-cli-jvm-composition
        run: |
          mkdir -p "$RUNNER_TEMP/scala-cli-jvm-composition-logs"
          set -o pipefail
          python3 tests/composition-native.py 2>&1 | tee "$RUNNER_TEMP/scala-cli-jvm-composition-logs/driver.log"
      - name: Retain JVM composition receipts, command logs, sources and fresh locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scala-cli-jvm-composition-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/scala-cli-jvm-composition/report.json
            ${{ runner.temp }}/scala-cli-jvm-composition/*.log
            ${{ runner.temp }}/scala-cli-jvm-composition/*.json
            ${{ runner.temp }}/scala-cli-jvm-composition/*.scala
            ${{ runner.temp }}/scala-cli-jvm-composition-logs/driver.log
          if-no-files-found: error
          retention-days: 30

  native-source-sdk:
    name: Source Native SDK (aarch64-darwin)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NATIVE_SDK_SYSTEM: aarch64-darwin
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 2
        eval-cache = false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the source SDK and run the locked Native fixture
        run: python3 tests/native-sdk-runtime.py "$RUNNER_TEMP/scala-cli-native-source-sdk"
      - name: Retain Native SDK build and runtime receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scala-cli-native-source-sdk-aarch64-darwin
          path: |
            ${{ runner.temp }}/scala-cli-native-source-sdk/*.json
            ${{ runner.temp }}/scala-cli-native-source-sdk/*.log
            ${{ runner.temp }}/scala-cli-native-source-sdk/*.nix
            ${{ runner.temp }}/scala-cli-native-source-sdk/project/*.scala
          if-no-files-found: error
          retention-days: 30

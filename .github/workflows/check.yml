# SPDX-License-Identifier: MIT
#
# Runs `nix flake check` on x86_64-linux and aarch64-linux: the unit tests
# of the scala-cli-purifier command, and every fixture built in the Nix
# sandbox from its lockfile. The only network access of the checks is the
# fixed-output fetches of locked files.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check the flake
        run: nix flake check --print-build-logs --keep-going
